  "content": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Maestro — Orchestrate Intelligence</title>\n  <style>\n    /* ============================================================\n       SECTION 1: DESIGN TOKENS (mirrors design/tokens.css)\n       All custom properties defined here for single-file portability\n       ============================================================ */\n    :root {\n      /* Color — Brand */\n      --color-brand-primary:        #6C47FF;\n      --color-brand-primary-dark:   #4F2FE0;\n      --color-brand-primary-light:  #A48BFF;\n      --color-brand-accent:         #00D4B8;\n      --color-brand-accent-dark:    #00A896;\n\n      /* Color — Neutrals */\n      --color-neutral-900:  #0A0A0F;\n      --color-neutral-850:  #10101A;\n      --color-neutral-800:  #14141F;\n      --color-neutral-700:  #1E1E30;\n      --color-neutral-600:  #2A2A40;\n      --color-neutral-500:  #3D3D5C;\n      --color-neutral-400:  #6B6B8A;\n      --color-neutral-300:  #9898B0;\n      --color-neutral-200:  #C4C4D4;\n      --color-neutral-100:  #E8E8F0;\n      --color-neutral-50:   #F4F4F8;\n      --color-white:        #FFFFFF;\n\n      /* Color — Semantic */\n      --color-success:  #00D4B8;\n      --color-warning:  #FFB547;\n      --color-error:    #FF4D6A;\n      --color-info:     #47A8FF;\n\n      /* Color — Console / UI Chrome */\n      --color-console-bg:       #0D0D18;\n      --color-console-border:   #2A2A40;\n      --color-console-header:   #12121E;\n      --color-console-gutter:   #1A1A28;\n      --color-console-text:     #C4C4D4;\n      --color-console-muted:    #6B6B8A;\n      --color-console-active:   #6C47FF;\n      --color-console-highlight:#A48BFF;\n\n      /* Typography */\n      --font-family-sans:  'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;\n      --font-family-mono:  'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;\n\n      --font-size-xs:   0.75rem;   /* 12px */\n      --font-size-sm:   0.875rem;  /* 14px */\n      --font-size-base: 1rem;      /* 16px */\n      --font-size-lg:   1.125rem;  /* 18px */\n      --font-size-xl:   1.25rem;   /* 20px */\n      --font-size-2xl:  1.5rem;    /* 24px */\n      --font-size-3xl:  1.875rem;  /* 30px */\n      --font-size-4xl:  2.25rem;   /* 36px */\n      --font-size-5xl:  3rem;      /* 48px */\n      --font-size-6xl:  3.75rem;   /* 60px */\n      --font-size-7xl:  4.5rem;    /* 72px */\n\n      --font-weight-regular: 400;\n      --font-weight-medium:  500;\n      --font-weight-semibold:600;\n      --font-weight-bold:    700;\n      --font-weight-black:   900;\n\n      --line-height-tight:  1.2;\n      --line-height-snug:   1.35;\n      --line-height-base:   1.6;\n      --line-height-relaxed:1.75;\n\n      --letter-spacing-tight: -0.03em;\n      --letter-spacing-snug:  -0.02em;\n      --letter-spacing-base:   0em;\n      --letter-spacing-wide:   0.06em;\n      --letter-spacing-wider:  0.1em;\n\n      /* Spacing */\n      --space-1:  0.25rem;\n      --space-2:  0.5rem;\n      --space-3:  0.75rem;\n      --space-4:  1rem;\n      --space-5:  1.25rem;\n      --space-6:  1.5rem;\n      --space-8:  2rem;\n      --space-10: 2.5rem;\n      --space-12: 3rem;\n      --space-16: 4rem;\n      --space-20: 5rem;\n      --space-24: 6rem;\n      --space-32: 8rem;\n\n      /* Border Radius */\n      --radius-sm:   4px;\n      --radius-base: 8px;\n      --radius-md:   12px;\n      --radius-lg:   16px;\n      --radius-xl:   24px;\n      --radius-2xl:  32px;\n      --radius-full: 9999px;\n\n      /* Shadows */\n      --shadow-sm:   0 1px 3px rgba(0,0,0,0.4);\n      --shadow-base: 0 4px 12px rgba(0,0,0,0.5);\n      --shadow-md:   0 8px 24px rgba(0,0,0,0.55);\n      --shadow-lg:   0 16px 48px rgba(0,0,0,0.6);\n      --shadow-glow-primary: 0 0 40px rgba(108,71,255,0.35);\n      --shadow-glow-accent:  0 0 40px rgba(0,212,184,0.25);\n\n      /* Transitions */\n      --transition-fast:   150ms ease;\n      --transition-base:   250ms ease;\n      --transition-slow:   400ms ease;\n      --transition-spring: 350ms cubic-bezier(0.34, 1.56, 0.64, 1);\n\n      /* Layout */\n      --max-width-content: 1200px;\n      --nav-height:         64px;\n    }\n\n    /* ============================================================\n       SECTION 2: RESET & BASE\n       ============================================================ */\n    *, *::before, *::after {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    html {\n      scroll-behavior: smooth;\n      -webkit-font-smoothing: antialiased;\n      -moz-osx-font-smoothing: grayscale;\n    }\n\n    body {\n      font-family: var(--font-family-sans);\n      font-size: var(--font-size-base);\n      line-height: var(--line-height-base);\n      color: var(--color-neutral-200);\n      background-color: var(--color-neutral-900);\n      overflow-x: hidden;\n    }\n\n    a {\n      color: inherit;\n      text-decoration: none;\n    }\n\n    img, svg {\n      display: block;\n      max-width: 100%;\n    }\n\n    button {\n      cursor: pointer;\n      border: none;\n      background: none;\n      font-family: inherit;\n    }\n\n    ul, ol {\n      list-style: none;\n    }\n\n    /* ============================================================\n       SECTION 3: TYPOGRAPHY UTILITIES\n       ============================================================ */\n    .text-xs   { font-size: var(--font-size-xs); }\n    .text-sm   { font-size: var(--font-size-sm); }\n    .text-base { font-size: var(--font-size-base); }\n    .text-lg   { font-size: var(--font-size-lg); }\n    .text-xl   { font-size: var(--font-size-xl); }\n    .text-2xl  { font-size: var(--font-size-2xl); }\n    .text-mono { font-family: var(--font-family-mono); }\n\n    .font-medium  { font-weight: var(--font-weight-medium); }\n    .font-semibold{ font-weight: var(--font-weight-semibold); }\n    .font-bold    { font-weight: var(--font-weight-bold); }\n\n    .text-muted   { color: var(--color-neutral-400); }\n    .text-primary { color: var(--color-brand-primary-light); }\n    .text-accent  { color: var(--color-brand-accent); }\n\n    /* ============================================================\n       SECTION 4: LAYOUT UTILITIES\n       ============================================================ */\n    .container {\n      width: 100%;\n      max-width: var(--max-width-content);\n      margin: 0 auto;\n      padding: 0 var(--space-6);\n    }\n\n    .flex          { display: flex; }\n    .flex-col      { flex-direction: column; }\n    .items-center  { align-items: center; }\n    .justify-center{ justify-content: center; }\n    .justify-between{ justify-content: space-between; }\n    .gap-2  { gap: var(--space-2); }\n    .gap-3  { gap: var(--space-3); }\n    .gap-4  { gap: var(--space-4); }\n    .gap-6  { gap: var(--space-6); }\n    .gap-8  { gap: var(--space-8); }\n\n    /* ============================================================\n       SECTION 5: NAVIGATION\n       ============================================================ */\n    .nav {\n      position: fixed;\n      top: 0;\n      left: 0;\n      right: 0;\n      z-index: 100;\n      height: var(--nav-height);\n      background: rgba(10, 10, 15, 0.85);\n      backdrop-filter: blur(16px) saturate(150%);\n      -webkit-backdrop-filter: blur(16px) saturate(150%);\n      border-bottom: 1px solid rgba(108,71,255,0.12);\n      transition: background var(--transition-base),\n                  border-color var(--transition-base);\n    }\n\n    .nav.scrolled {\n      background: rgba(10, 10, 15, 0.97);\n      border-bottom-color: rgba(108,71,255,0.25);\n    }\n\n    .nav__inner {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      height: 100%;\n    }\n\n    /* Logo */\n    .nav__logo {\n      display: flex;\n      align-items: center;\n      gap: var(--space-3);\n      font-weight: var(--font-weight-bold);\n      font-size: var(--font-size-xl);\n      letter-spacing: var(--letter-spacing-tight);\n      color: var(--color-white);\n      transition: opacity var(--transition-fast);\n    }\n\n    .nav__logo:hover { opacity: 0.85; }\n\n    .nav__logo-mark {\n      width: 32px;\n      height: 32px;\n      border-radius: var(--radius-base);\n      background: linear-gradient(135deg, var(--color-brand-primary) 0%, var(--color-brand-accent) 100%);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      box-shadow: 0 0 16px rgba(108,71,255,0.5);\n    }\n\n    /* Nav Links */\n    .nav__links {\n      display: flex;\n      align-items: center;\n      gap: var(--space-8);\n    }\n\n    .nav__link {\n      font-size: var(--font-size-sm);\n      font-weight: var(--font-weight-medium);\n      color: var(--color-neutral-300);\n      letter-spacing: var(--letter-spacing-wide);\n      text-transform: uppercase;\n      transition: color var(--transition-fast);\n      position: relative;\n    }\n\n    .nav__link::after {\n      content: '';\n      position: absolute;\n      bottom: -4px;\n      left: 0;\n      right: 0;\n      height: 1px;\n      background: var(--color-brand-primary-light);\n      transform: scaleX(0);\n      transform-origin: left;\n      transition: transform var(--transition-base);\n    }\n\n    .nav__link:hover {\n      color: var(--color-white);\n    }\n\n    .nav__link:hover::after {\n      transform: scaleX(1);\n    }\n\n    /* Nav Actions */\n    .nav__actions {\n      display: flex;\n      align-items: center;\n      gap: var(--space-4);\n    }\n\n    /* Status badge */\n    .nav__status {\n      display: flex;\n      align-items: center;\n      gap: var(--space-2);\n      font-family: var(--font-family-mono);\n      font-size: var(--font-size-xs);\n      color: var(--color-brand-accent);\n      letter-spacing: var(--letter-spacing-wider);\n      text-transform: uppercase;\n    }\n\n    .nav__status-dot {\n      width: 6px;\n      height: 6px;\n      border-radius: var(--radius-full);\n      background: var(--color-brand-accent);\n      animation: pulse-dot 2s ease-in-out infinite;\n    }\n\n    @keyframes pulse-dot {\n      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,212,184,0.6); }\n      50%       { opacity: 0.7; box-shadow: 0 0 0 5px rgba(0,212,184,0); }\n    }\n\n    /* Mobile menu toggle */\n    .nav__mobile-toggle {\n      display: none;\n      flex-direction: column;\n      gap: 5px;\n      padding: var(--space-2);\n      cursor: pointer;\n    }\n\n    .nav__mobile-toggle span {\n      display: block;\n      width: 22px;\n      height: 2px;\n      background: var(--color-neutral-200);\n      border-radius: 2px;\n      transition: transform var(--transition-base), opacity var(--transition-base);\n    }\n\n    /* ============================================================\n       SECTION 6: BUTTONS\n       ============================================================ */\n    .btn {\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      gap: var(--space-2);\n      padding: 0.625rem var(--space-6);\n      font-size: var(--font-size-sm);\n      font-weight: var(--font-weight-semibold);\n      letter-spacing: var(--letter-spacing-wide);\n      border-radius: var(--radius-full);\n      transition: all var(--transition-base);\n      white-space: nowrap;\n      position: relative;\n      overflow: hidden;\n    }\n\n    .btn::before {\n      content: '';\n      position: absolute;\n      inset: 0;\n      background: rgba(255,255,255,0);\n      transition: background var(--transition-fast);\n    }\n\n    .btn:hover::before {\n      background: rgba(255,255,255,0.06);\n    }\n\n    /* Primary button */\n    .btn--primary {\n      background: linear-gradient(135deg, var(--color-brand-primary) 0%, var(--color-brand-primary-dark) 100%);\n      color: var(--color-white);\n      box-shadow: 0 0 24px rgba(108,71,255,0.4),\n                  0 4px 12px rgba(0,0,0,0.3);\n    }\n\n    .btn--primary:hover {\n      transform: translateY(-1px);\n      box-shadow: 0 0 32px rgba(108,71,255,0.6),\n                  0 8px 20px rgba(0,0,0,0.4);\n    }\n\n    .btn--primary:active {\n      transform: translateY(0);\n    }\n\n    /* Ghost button */\n    .btn--ghost {\n      background: transparent;\n      color: var(--color-neutral-200);\n      border: 1px solid var(--color-neutral-600);\n    }\n\n    .btn--ghost:hover {\n      border-color: var(--color-brand-primary-light);\n      color: var(--color-white);\n      box-shadow: 0 0 12px rgba(108,71,255,0.2);\n    }\n\n    /* Accent button */\n    .btn--accent {\n      background: linear-gradient(135deg, var(--color-brand-accent) 0%, var(--color-brand-accent-dark) 100%);\n      color: var(--color-neutral-900);\n      font-weight: var(--font-weight-bold);\n      box-shadow: 0 0 24px rgba(0,212,184,0.3);\n    }\n\n    .btn--accent:hover {\n      transform: translateY(-1px);\n      box-shadow: 0 0 36px rgba(0,212,184,0.5);\n    }\n\n    /* Large button */\n    .btn--lg {\n      padding: 0.875rem var(--space-8);\n      font-size: var(--font-size-base);\n      border-radius: var(--radius-full);\n    }\n\n    /* ============================================================\n       SECTION 7: HERO SECTION\n       ============================================================ */\n    .hero {\n      position: relative;\n      min-height: 100vh;\n      display: flex;\n      flex-direction: column;\n      justify-content: center;\n      padding-top: var(--nav-height);\n      overflow: hidden;\n    }\n\n    /* Animated background mesh */\n    .hero__bg {\n      position: absolute;\n      inset: 0;\n      pointer-events: none;\n      z-index: 0;\n    }\n\n    .hero__bg-gradient {\n      position: absolute;\n      inset: 0;\n      background:\n        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(108,71,255,0.2) 0%, transparent 60%),\n        radial-gradient(ellipse 50% 50% at 85% 30%, rgba(0,212,184,0.1) 0%, transparent 50%),\n        radial-gradient(ellipse 40% 40% at 15% 70%, rgba(108,71,255,0.08) 0%, transparent 50%);\n    }\n\n    .hero__bg-grid {\n      position: absolute;\n      inset: 0;\n      background-image:\n        linear-gradient(rgba(108,71,255,0.04) 1px, transparent 1px),\n        linear-gradient(90deg, rgba(108,71,255,0.04) 1px, transparent 1px);\n      background-size: 60px 60px;\n      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 80%);\n    }\n\n    /* Floating orbs */\n    .hero__orb {\n      position: absolute;\n      border-radius: var(--radius-full);\n      filter: blur(80px);\n      pointer-events: none;\n      animation: orb-float 8s ease-in-out infinite;\n    }\n\n    .hero__orb--1 {\n      width: 500px;\n      height: 500px;\n      background: rgba(108,71,255,0.12);\n      top: -100px;\n      left: 50%;\n      transform: translateX(-50%);\n      animation-delay: 0s;\n    }\n\n    .hero__orb--2 {\n      width: 300px;\n      height: 300px;\n      background: rgba(0,212,184,0.08);\n      bottom: 10%;\n      right: 5%;\n      animation-delay: -4s;\n      animation-duration: 10s;\n    }\n\n    .hero__orb--3 {\n      width: 200px;\n      height: 200px;\n      background: rgba(108,71,255,0.1);\n      bottom: 20%;\n      left: 5%;\n      animation-delay: -2s;\n      animation-duration: 7s;\n    }\n\n    @keyframes orb-float {\n      0%, 100% { transform: translateY(0) scale(1); }\n      33%       { transform: translateY(-20px) scale(1.05); }\n      66%       { transform: translateY(10px) scale(0.97); }\n    }\n\n    /* Hero Content */\n    .hero__content {\n      position: relative;\n      z-index: 1;\n      text-align: center;\n      max-width: 860px;\n      margin: 0 auto;\n      padding: var(--space-16) var(--space-6) var(--space-12);\n    }\n\n    /* Eyebrow badge */\n    .hero__eyebrow {\n      display: inline-flex;\n      align-items: center;\n      gap: var(--space-2);\n      padding: var(--space-2) var(--space-4);\n      background: rgba(108,71,255,0.12);\n      border: 1px solid rgba(108,71,255,0.3);\n      border-radius: var(--radius-full);\n      font-family: var(--font-family-mono);\n      font-size: var(--font-size-xs);\n      color: var(--color-brand-primary-light);\n      letter-spacing: var(--letter-spacing-wider);\n      text-transform: uppercase;\n      margin-bottom: var(--space-8);\n      animation: fade-up 0.6s ease both;\n      animation-delay: 0.1s;\n    }\n\n    .hero__eyebrow-icon {\n      width: 16px;\n      height: 16px;\n    }\n\n    /* Headline */\n    .hero__headline {\n      font-size: clamp(var(--font-size-4xl), 8vw, var(--font-size-7xl));\n      font-weight: var(--font-weight-black);\n      letter-spacing: var(--letter-spacing-tight);\n      line-height: var(--line-height-tight);\n      color: var(--color-white);\n      margin-bottom: var(--space-6);\n      animation: fade-up 0.6s ease both;\n      animation-delay: 0.2s;\n    }\n\n    .hero__headline-gradient {\n      background: linear-gradient(135deg, var(--color-brand-primary-light) 0%, var(--color-brand-accent) 100%);\n      -webkit-background-clip: text;\n      -webkit-text-fill-color: transparent;\n      background-clip: text;\n    }\n\n    /* Subheadline */\n    .hero__sub {\n      font-size: clamp(var(--font-size-lg), 2.5vw, var(--font-size-2xl));\n      color: var(--color-neutral-300);\n      line-height: var(--line-height-relaxed);\n      max-width: 640px;\n      margin: 0 auto var(--space-10);\n      animation: fade-up 0.6s ease both;\n      animation-delay: 0.35s;\n    }\n\n    /* CTA Group */\n    .hero__ctas {\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: var(--space-4);\n      flex-wrap: wrap;\n      animation: fade-up 0.6s ease both;\n      animation-delay: 0.5s;\n    }\n\n    /* Social proof ticker */\n    .hero__proof {\n      margin-top: var(--space-12);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: var(--space-8);\n      flex-wrap: wrap;\n      animation: fade-up 0.6s ease both;\n      animation-delay: 0.65s;\n    }\n\n    .hero__proof-item {\n      display: flex;\n      align-items: center;\n      gap: var(--space-2);\n      font-size: var(--font-size-sm);\n      color: var(--color-neutral-400);\n    }\n\n    .hero__proof-icon {\n      color: var(--color-brand-accent);\n    }\n\n    /* Scroll hint */\n    .hero__scroll-hint {\n      position: absolute;\n      bottom: var(--space-8);\n      left: 50%;\n      transform: translateX(-50%);\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      gap: var(--space-2);\n      color: var(--color-neutral-500);\n      font-size: var(--font-size-xs);\n      letter-spacing: var(--letter-spacing-wider);\n      text-transform: uppercase;\n      animation: fade-up 0.6s ease both;\n      animation-delay: 0.8s;\n    }\n\n    .hero__scroll-arrow {\n      width: 24px;\n      height: 24px;\n      animation: bounce-y 2s ease-in-out infinite;\n    }\n\n    @keyframes bounce-y {\n      0%, 100% { transform: translateY(0); }\n      50%       { transform: translateY(6px); }\n    }\n\n    @keyframes fade-up {\n      from { opacity: 0; transform: translateY(24px); }\n      to   { opacity: 1; transform: translateY(0); }\n    }\n\n    /* ============================================================\n       SECTION 8: CONSOLE VISUALIZATION\n       ============================================================ */\n    .console-section {\n      padding: var(--space-24) 0;\n      position: relative;\n    }\n\n    .console-section__header {\n      text-align: center;\n      max-width: 600px;\n      margin: 0 auto var(--space-16);\n    }\n\n    .section-eyebrow {\n      font-family: var(--font-family-mono);\n      font-size: var(--font-size-xs);\n      color: var(--color-brand-accent);\n      letter-spacing: var(--letter-spacing-wider);\n      text-transform: uppercase;\n      margin-bottom: var(--space-4);\n    }\n\n    .section-title {\n      font-size: clamp(var(--font-size-3xl), 5vw, var(--font-size-5xl));\n      font-weight: var(--font-weight-bold);\n      letter-spacing: var(--letter-spacing-tight);\n      color: var(--color-white);\n      line-height: var(--line-height-snug);\n      margin-bottom: var(--space-4);\n    }\n\n    .section-desc {\n      font-size: var(--font-size-lg);\n      color: var(--color-neutral-400);\n      line-height: var(--line-height-relaxed);\n    }\n\n    /* Console chrome */\n    .console {\n      background: var(--color-console-bg);\n      border: 1px solid var(--color-console-border);\n      border-radius: var(--radius-xl);\n      overflow: hidden;\n      box-shadow:\n        var(--shadow-lg),\n        0 0 0 1px rgba(108,71,255,0.08),\n        inset 0 1px 0 rgba(255,255,255,0.04);\n      position: relative;\n    }\n\n    .console::before {\n      content: '';\n      position: absolute;\n      top: -1px;\n      left: 30%;\n      right: 30%;\n      height: 1px;\n      background: linear-gradient(90deg, transparent, var(--color-brand-primary), transparent);\n    }\n\n    /* Console top bar */\n    .console__bar {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      padding: 0 var(--space-4);\n      height: 44px;\n      background: var(--color-console-header);\n      border-bottom: 1px solid var(--color-console-border);\n    }\n\n    .console__dots {\n      display: flex;\n      gap: var(--space-2);\n    }\n\n    .console__dot {\n      width: 10px;\n      height: 10px;\n      border-radius: var(--radius-full);\n    }\n\n    .console__dot--red    { background: #FF5F57; }\n    .console__dot--yellow { background: #FEBC2E; }\n    .console__dot--green  { background: #28C840; }\n\n    .console__title {\n      font-family: var(--font-family-mono);\n      font-size: var(--font-size-xs);\n      color: var(--color-console-muted);\n      letter-spacing: var(--letter-spacing-wide);\n    }\n\n    .console__badge {\n      display: flex;\n      align-items: center;\n      gap: var(--space-2);\n      font-family: var(--font-family-mono);\n      font-size: var(--font-size-xs);\n      color: var(--color-brand-accent);\n    }\n\n    .console__badge-dot {\n      width: 5px
